  <!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>风廊五连棋 - 双结算版</title>
<style>
    /* 10种棋盘主题 */
    :root, body.theme-0 { --bg: #e2e8f0; --panel: #fff; --cell: #f1f5f9; --border: #94a3b8; --text: #1e293b; --btn: #f8fafc; --btn-s: #cbd5e1; }
    body.theme-1 { --bg: #d1e7e0; --panel: #f2fcf9; --cell: #e0f2ec; --border: #7eb8a5; --text: #134e4a; --btn: #f2fcf9; --btn-s: #b2d8ce; }
    body.theme-2 { --bg: #e1dbe9; --panel: #f8f5fc; --cell: #efeaf5; --border: #9d8bc4; --text: #3b2b5c; --btn: #f8f5fc; --btn-s: #d0c6e3; }
    body.theme-3 { --bg: #f2ecdf; --panel: #fffdfa; --cell: #faf6ef; --border: #bdae95; --text: #45321e; --btn: #fffdfa; --btn-s: #e3d9c8; }
    body.theme-4 { --bg: #ffedd5; --panel: #fff7ed; --cell: #ffedd5; --border: #fdba74; --text: #7c2d12; --btn: #fff7ed; --btn-s: #fed7aa; }
    body.theme-5 { --bg: #fce7f3; --panel: #fdf2f8; --cell: #fce7f3; --border: #f9a8d4; --text: #831843; --btn: #fdf2f8; --btn-s: #fbcfe8; }
    body.theme-6 { --bg: #dcfce7; --panel: #f0fdf4; --cell: #dcfce7; --border: #86efac; --text: #14532d; --btn: #f0fdf4; --btn-s: #bbf7d0; }
    body.theme-7 { --bg: #121820; --panel: #1c2533; --cell: #1f2d3d; --border: #2a3b4f; --text: #e2e8f0; --btn: #1e293b; --btn-s: #0f172a; }
    body.theme-8 { --bg: #ffffff; --panel: #ffffff; --cell: #f8f9fa; --border: #dee2e6; --text: #212529; --btn: #ffffff; --btn-s: #ced4da; }
    body.theme-9 { --bg: #0f0c29; --panel: #302b63; --cell: #24243e; --border: #ff00cc; --text: #00ffff; --btn: #24243e; --btn-s: #8a2be2; }

    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    body { background: var(--bg); color: var(--text); font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; display: flex; justify-content: center; align-items: center; margin: 0; min-height: 100vh; overflow: hidden; transition: background 0.3s; }
    
    .layout { display: flex; flex-direction: row; gap: 20px; width: 100%; max-width: 1200px; max-height: 98vh; padding: 10px; align-items: center; justify-content: center; }
    .left-panel { flex: 0 0 350px; background: var(--panel); padding: 15px; border-radius: 16px; border: 2px solid var(--border); display: flex; flex-direction: column; gap: 10px; max-height: 96vh; overflow-y: auto; transition: all 0.3s;}
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 20px; }
    .theme-select { padding: 4px; border-radius: 6px; background: var(--btn); color: var(--text); border: 1px solid var(--border); font-weight: bold; outline: none; }

    /* 风向指示器 */
    .wind-box { background: var(--cell); border: 2px solid #38bdf8; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 16px; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .wind-arrow { font-size: 24px; }

    .player-status { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--btn); border-radius: 10px; border: 2px solid var(--border); font-weight: bold; font-size: 15px; }
    .player-status.active.p1 { border-color: #0284c7; background: rgba(2,132,199,0.1); }
    .player-status.active.p2 { border-color: #ea580c; background: rgba(234,88,12,0.1); }
    .gold-text { color: #d97706; font-size: 18px; }
    .inv-text { font-size: 12px; color: #475569; margin-top: 4px; font-weight: normal; }
    .inv-text span { margin-right: 8px; }
    
    .btn-row { display: flex; gap: 8px; margin-top: 5px; }
    button.game-btn { padding: 10px 8px; border-radius: 8px; border: 2px solid var(--border); background: var(--btn); color: var(--text); font-weight: bold; cursor: pointer; flex: 1; box-shadow: 0 3px 0 var(--btn-s); font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    button.game-btn:active { transform: translateY(3px); box-shadow: none; }
    button.game-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .selected { background: #3b82f6; color: white; border-color: #2563eb; box-shadow: 0 3px 0 #1e40af; }
    .btn-sub { font-size: 12px; font-weight: normal; color: #475569; }
    .selected .btn-sub { color: #dbeafe; }

    .rules-box { font-size: 13px; line-height: 1.6; color: var(--text); background: var(--cell); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    
    .right-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;}
    
    .board { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: var(--border); padding: 8px; border-radius: 12px; aspect-ratio: 1; width: min(85vh, 100%); transition: all 0.3s; }
    .cell { background: var(--cell); border-radius: 6px; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 1px solid var(--border); aspect-ratio: 1; position: relative; transition: all 0.2s;}
    .cell:hover { border-color: #3b82f6; transform: scale(1.05); }
    
    .piece { position: absolute; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; }
    .p1.gold { background: linear-gradient(135deg, #38bdf8, #0284c7); border-radius: 50%; width: 85%; height: 85%; border: 2px solid #bae6fd; }
    .p2.gold { background: linear-gradient(135deg, #fb923c, #ea580c); border-radius: 50%; width: 85%; height: 85%; border: 2px solid #fed7aa; }
    .p1.giant { background: linear-gradient(135deg, #818cf8, #4f46e5); border-radius: 8px; width: 85%; height: 85%; }
    .p2.giant { background: linear-gradient(135deg, #f472b6, #db2777); border-radius: 8px; width: 85%; height: 85%; }
    .p1.normal { background: #94a3b8; border-radius: 6px; width: 75%; height: 75%; }
    .p2.normal { background: #cbd5e1; border-radius: 6px; width: 75%; height: 75%; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; padding: 30px 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 4px solid #38bdf8; }
    .modal-content h2 { margin: 0 0 15px 0; font-size: 28px; color: #1e293b; }
    .modal-content p { margin: 5px 0; font-size: 16px; color: #475569; font-weight: bold; }
    .modal-btn { margin-top: 20px; background: #3b82f6; color: white; padding: 12px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; }

    @media (max-width: 850px) {
        body { overflow: auto; padding: 10px; }
        .layout { flex-direction: column; max-height: none; align-items: stretch; gap: 10px; }
        .left-panel { width: 100%; order: 2; }
        .right-panel { width: 100%; order: 1; }
        .board { width: 100%; max-width: 95vw; }
        .piece { font-size: 5vw; }
    }
</style>
</head>
<body class="theme-0">
<div class="layout">
    <div class="left-panel">
        <div class="top-bar">
            <span>🌪️ 风廊五连</span>
            <select class="theme-select" id="themeSelect" onchange="changeTheme()">
                <option value="theme-0">莫兰迪灰</option>
                <option value="theme-1">青瓷温润</option>
                <option value="theme-2">暮光紫夜</option>
                <option value="theme-3">柔和暖沙</option>
                <option value="theme-4">晚霞余晖</option>
                <option value="theme-5">樱花粉黛</option>
                <option value="theme-6">生机绿意</option>
                <option value="theme-7">深邃暗夜</option>
                <option value="theme-8">极简纯白</option>
                <option value="theme-9">赛博霓虹</option>
            </select>
        </div>

        <div class="wind-box" id="windBox">
            风廊五连方向: <span id="windText">东风</span> <span class="wind-arrow" id="windArrow">➡️</span>
        </div>

        <div id="p1box" class="player-status p1">
            <div style="flex:1;">
                <div style="display:flex; justify-content:space-between;">
                    <span id="p1name">🔵 先手</span>
                    <span>金:<span id="p1g" class="gold-text">120</span></span>
                </div>
                <div class="inv-text">
                    <span>💨风:<span id="p1c">12</span></span>
                    <span>🏛️巨:<span id="p1b">3</span></span>
                    <span>🧱普:<span id="p1n">5</span></span>
                </div>
            </div>
        </div>

        <div id="p2box" class="player-status p2">
            <div style="flex:1;">
                <div style="display:flex; justify-content:space-between;">
                    <span id="p2name">🔴 后手</span>
                    <span>金:<span id="p2g" class="gold-text">120</span></span>
                </div>
                <div class="inv-text">
                    <span>💨风:<span id="p2c">12</span></span>
                    <span>🏛️巨:<span id="p2b">3</span></span>
                    <span>🧱普:<span id="p2n">5</span></span>
                </div>
            </div>
        </div>

        <div style="text-align:center; font-weight:bold; font-size:16px; margin: 5px 0;" id="turn">🔵 先手回合</div>

        <div class="rules-box">
            <b>🎯 规则说明</b><br>
            1. <b>任意五连</b>：连成五子即 +10 金币（游戏继续）。<br>
            2. <b>风向五连</b>：沿风向连线成功直接获胜，并 +50 金币！<br>
            3. 💨风廊(5金)，🏛️巨型(8金)，🧱普通(2金，仅阻挡)。<br>
            4. 无子可下时，金币多者获胜。<br>
            5. <b>先手轮换</b>：首局随机，之后败者先手。
        </div>

        <div class="btn-row">
            <button id="bG" class="game-btn" onclick="makeMove('gold')">
                <span>💨 风廊</span>
                <span class="btn-sub">5金 | 剩 <span id="bGc">12</span></span>
            </button>
            <button id="bB" class="game-btn" onclick="makeMove('giant')">
                <span>🏛️ 巨型</span>
                <span class="btn-sub">8金 | 剩 <span id="bBc">3</span></span>
            </button>
        </div>
        <div class="btn-row">
            <button id="bN" class="game-btn" onclick="makeMove('normal')">
                <span>🧱 普通</span>
                <span class="btn-sub">2金 | 剩 <span id="bNc">5</span></span>
            </button>
        </div>
    </div>

    <div class="right-panel">
        <div class="board" id="board"></div>
    </div>
</div>

<div class="modal-overlay" id="gameOverModal">
    <div class="modal-content">
        <h2 id="modalTitle">游戏结束</h2>
        <p id="modalWinner"></p>
        <button class="modal-btn" onclick="closeModalAndRestart()">再来一局</button>
    </div>
</div>

<script>
    window.changeTheme = function() {
        document.body.className = document.getElementById('themeSelect').value;
    }

    const S = 9, P1 = 1, P2 = 2;
    const PRICES = { 'gold': 5, 'giant': 8, 'normal': 2 };

    let board, cur, p1, p2, over, msg, wind, selType;
    let nextStarter = Math.random() < 0.5 ? P1 : P2; 
    let rewardedLines = new Set(); // 记录已经奖励过的五连（避免重复加金币）

    const WIND_DIRS = [
        { dr: 0, dc: 1, text: '东风', arrow: '➡️' },
        { dr: 1, dc: 1, text: '东南风', arrow: '↘️' },
        { dr: 1, dc: 0, text: '南风', arrow: '⬇️' },
        { dr: 1, dc: -1, text: '西南风', arrow: '↙️' },
        { dr: 0, dc: -1, text: '西风', arrow: '⬅️' },
        { dr: -1, dc: -1, text: '西北风', arrow: '↖️' },
        { dr: -1, dc: 0, text: '北风', arrow: '⬆️' },
        { dr: -1, dc: 1, text: '东北风', arrow: '↗️' }
    ];

    function initData() {
        wind = WIND_DIRS[Math.floor(Math.random() * 8)];
        board = Array.from({length: S}, () => Array(S).fill(null));
        cur = nextStarter;
        over = false; selType = null; msg = "";
        rewardedLines.clear(); // 重置奖励记录
        p1 = { g: 120, c: 12, b: 3, n: 5 };
        p2 = { g: 120, c: 12, b: 3, n: 5 };
        render();
    }

    initData();

    window.makeMove = function(type) {
        if (over) return;
        const my = cur === P1 ? p1 : p2;
        if(!my || my.g < PRICES[type]) return alert("金币不足");
        selType = (selType === type) ? null : type;
        highlightButtons();
    }

    function highlightButtons() {
        document.getElementById('bG').className = 'game-btn' + (selType === 'gold' ? ' selected' : '');
        document.getElementById('bB').className = 'game-btn' + (selType === 'giant' ? ' selected' : '');
        document.getElementById('bN').className = 'game-btn' + (selType === 'normal' ? ' selected' : '');
    }

    function play(r, c) {
        if (over || !selType || board[r][c] !== null) return;
        
        const my = cur === P1 ? p1 : p2;
        
        my.g -= PRICES[selType];
        if(selType === 'gold') my.c--;
        else if(selType === 'giant') my.b--;
        else my.n--;
        
        board[r][c] = { owner: cur, type: selType };
        selType = null;
        
        // 检查是否有新的五连（任意方向或风向）
        checkAndReward(cur, r, c);

        if (over) {
            render();
            checkModal();
            return;
        }

        // 检查游戏是否结束
        const p1Move = p1.g >= 2 && (p1.c > 0 || p1.b > 0 || p1.n > 0);
        const p2Move = p2.g >= 2 && (p2.c > 0 || p2.b > 0 || p2.n > 0);
        if(!p1Move && !p2Move) {
            over = true;
            if(p1.g > p2.g) { msg = "🔵 先手金币更多获胜！"; nextStarter = P2; }
            else if(p2.g > p1.g) { msg = "🔴 后手金币更多获胜！"; nextStarter = P1; }
            else { msg = "平局！金币相同。"; nextStarter = cur === P1 ? P2 : P1; }
        } else {
            cur = cur === P1 ? P2 : P1;
        }
        
        render();
        checkModal();
    }

    function checkAndReward(role, lastR, lastC) {
        const my = role === P1 ? p1 : p2;
        const dirs = [ { dr: 0, dc: 1 }, { dr: 1, dc: 0 }, { dr: 1, dc: 1 }, { dr: 1, dc: -1 } ];
        let foundWindWin = false;

        dirs.forEach(d => {
            // 计算当前方向的连续棋子
            let coords = [[lastR, lastC]];
            // 向前查
            for (let k = 1; k < 5; k++) {
                const nr = lastR + d.dr * k, nc = lastC + d.dc * k;
                if (nr < 0 || nr >= S || nc < 0 || nc >= S) break;
                const next = board[nr][nc];
                if (!next || next.owner !== role || next.type !== 'gold') break;
                coords.push([nr, nc]);
            }
            // 向后查
            for (let k = 1; k < 5; k++) {
                const nr = lastR - d.dr * k, nc = lastC - d.dc * k;
                if (nr < 0 || nr >= S || nc < 0 || nc >= S) break;
                const next = board[nr][nc];
                if (!next || next.owner !== role || next.type !== 'gold') break;
                coords.push([nr, nc]);
            }

            if (coords.length >= 5) {
                // 生成唯一标识符，防止重复加金币
                const sorted = [...coords].sort((a,b) => a[0] - b[0] || a[1] - b[1]);
                const lineKey = role + '-' + sorted.map(p => p.join(',')).join('|');
                
                if (!rewardedLines.has(lineKey)) {
                    rewardedLines.add(lineKey);
                    
                    // 判断这个方向是否与风向平行
                    const isWindMatch = (d.dr * wind.dc - d.dc * wind.dr === 0);
                    
                    if (isWindMatch) {
                        my.g += 50;
                        over = true;
                        msg = (role === P1 ? "🔵 先手" : "🔴 后手") + " 达成风向五连，绝杀获胜！(+50金)";
                        nextStarter = role === P1 ? P2 : P1;
                        foundWindWin = true;
                    } else {
                        my.g += 10;
                        if (!msg.includes('任意五连')) {
                           msg += (role === P1 ? "🔵 先手" : "🔴 后手") + " 达成任意五连，+10金！ "; 
                        }
                    }
                }
            }
        });
        
        return foundWindWin;
    }

    function render() {
        document.getElementById('windText').innerText = wind.text;
        document.getElementById('windArrow').innerText = wind.arrow;
        
        document.getElementById('p1g').innerText = p1.g;
        document.getElementById('p1c').innerText = p1.c;
        document.getElementById('p1b').innerText = p1.b;
        document.getElementById('p1n').innerText = p1.n;
        
        document.getElementById('p2g').innerText = p2.g;
        document.getElementById('p2c').innerText = p2.c;
        document.getElementById('p2b').innerText = p2.b;
        document.getElementById('p2n').innerText = p2.n;

        const my = cur === P1 ? p1 : p2;
        document.getElementById('bGc').innerText = my.c;
        document.getElementById('bBc').innerText = my.b;
        document.getElementById('bNc').innerText = my.n;

        const bd = document.getElementById('board');
        bd.innerHTML = '';
        for (let r = 0; r < S; r++) {
            for (let c = 0; c < S; c++) {
                const d = document.createElement('div');
                d.className = 'cell';
                const p = board[r][c];
                if (p) {
                    const e = document.createElement('div');
                    e.className = `piece p${p.owner} ${p.type}`;
                    e.innerText = p.type === 'gold' ? '⚡' : p.type === 'giant' ? '🏛️' : '🧱';
                    d.appendChild(e);
                }
                d.onclick = () => play(r, c);
                bd.appendChild(d);
            }
        }
        
        document.getElementById('p1name').innerText = cur === P1 ? "🔵 先手 (当前)" : "🔵 先手";
        document.getElementById('p2name').innerText = cur === P2 ? "🔴 后手 (当前)" : "🔴 后手";
        
        document.getElementById('p1box').className = (cur === P1 && !over) ? 'player-status p1 active' : 'player-status p1';
        document.getElementById('p2box').className = (cur === P2 && !over) ? 'player-status p2 active' : 'player-status p2';
        
        if (over) document.getElementById('turn').innerText = "游戏结束";
        else document.getElementById('turn').innerText = cur === P1 ? "🔵 先手回合" : "🔴 后手回合";
        
        document.getElementById('bG').disabled = over || my.c <= 0 || my.g < PRICES['gold'];
        document.getElementById('bB').disabled = over || my.b <= 0 || my.g < PRICES['giant'];
        document.getElementById('bN').disabled = over || my.n <= 0 || my.g < PRICES['normal'];
        
        highlightButtons();
    }

    let isModalOpen = false;
    function checkModal() {
        if (over && !isModalOpen) {
            isModalOpen = true;
            document.getElementById('modalWinner').innerText = msg;
            document.getElementById('gameOverModal').style.display = 'flex';
        } else if (!over && isModalOpen) {
            isModalOpen = false;
            document.getElementById('gameOverModal').style.display = 'none';
        }
    }

    window.closeModalAndRestart = function() {
        document.getElementById('gameOverModal').style.display = 'none';
        isModalOpen = false;
        initData();
    }
</script>
</body>
</html>
